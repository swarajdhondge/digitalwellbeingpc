name: Build and Release

# Fires on version tags like v2.1.0. The tag is the single source of truth
# for the release version (see the `version` job below).
on:
  push:
    tags:
      - 'v*.*.*'
  # Build-only dry run: builds and uploads the artifact, never publishes or signs.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, x.y.z, for example 2.5.0'
        required: true
        type: string

permissions:
  contents: write

env:
  PROJECT: 'digital-wellbeing-app/digital-wellbeing-app.csproj'
  PACKAGE_NAME: 'DigitalWellbeingPC'
  MAIN_EXE: 'DigitalWellbeing.exe'

# NOTE: the Microsoft Store MSIX is intentionally NOT built here. Nothing consumes it
# from the GitHub release (winget uses Setup.exe; the auto-updater uses the nupkg/RELEASES),
# and Store submission is a manual Partner Center upload. Build it locally when submitting:
#   ./scripts/build-msix.ps1 -Version <x.y.z>   ->  artifacts/store/Pulse-<x.y.z>-x64.msix

jobs:
  # --------------------------------------------------------------------------
  # VERSION SINGLE-SOURCING
  # Compute the version exactly once (git tag minus the leading `v`) and expose
  # it to every downstream job. Consumers: csproj <Version>, `vpk pack -v`,
  # and /p:AppxManifestVersion.
  # --------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Derive version from tag
        id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION#v}"
            PATTERN='^[0-9]+\.[0-9]+\.[0-9]+$'
          else
            VERSION="${GITHUB_REF_NAME#v}"
            PATTERN='^[0-9]+\.[0-9]+\.[0-9]+$'
          fi
          # The version is pasted into later commands, so only accept a plain x.y.z.
          if [[ ! "$VERSION" =~ $PATTERN ]]; then
            echo "Version '$VERSION' (ref '$GITHUB_REF_NAME') is not x.y.z" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  # --------------------------------------------------------------------------
  # TEST GATE
  # Unit tests must pass before anything is packaged. Every build job `needs`
  # this job, so a red test run blocks the entire release.
  # --------------------------------------------------------------------------
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Run unit tests
        run: dotnet test digital-wellbeing-app/Tests/Tests.csproj -c Release

      - name: Run command-line tool tests
        run: dotnet test pulse-cli/Tests/pulse-cli.Tests.csproj -c Release

      # UI and soak tests launch the real built exe, so they run here (before a release build),
      # not on every PR. A failure blocks the release build. AppSession gives the app a temp
      # data folder (PULSE_DATA_DIR).
      - name: Build solution (Release)
        run: dotnet build DigitalWellbeing.sln -c Release

      - name: UI and soak tests
        id: ui-tests
        timeout-minutes: 15
        env:
          DW_APP_EXE: ${{ github.workspace }}\digital-wellbeing-app\bin\Release\net9.0-windows10.0.26100.0\DigitalWellbeing.exe
          DW_SHOT_DIR: ${{ runner.temp }}\dw-uishots
        run: dotnet test UITests/UITests.csproj -c Release --no-build --filter "FullyQualifiedName~ShellTests|FullyQualifiedName~SoakTests" --logger "trx;LogFileName=ui-tests.trx" --results-directory "${{ runner.temp }}\ui-test-results"

      - name: Upload UI test screenshots and logs
        if: failure() && steps.ui-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-output
          path: |
            ${{ runner.temp }}\dw-uishots
            ${{ runner.temp }}\ui-test-results
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # VELOPACK BUILD (unsigned)
  # Publishes the app and produces the Velopack release set (Setup exe + delta
  # packages) as an UNSIGNED workflow artifact. It intentionally does NOT touch
  # the GitHub Release — see the UNSIGNED-ARTIFACT BOUNDARY note further down.
  # --------------------------------------------------------------------------
  velopack-build:
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.161  # same version as the Velopack package

      - name: Stamp version into AssemblyInfo.cs and app.manifest
        shell: pwsh
        run: ./.github/scripts/stamp-version.ps1 -Version "${{ needs.version.outputs.version }}"

      # Inject the tag version into the csproj <Version> via an MSBuild property
      # override (cleaner than rewriting the file on disk).
      # The `pulse` command-line tool ships next to the app. Published first so the app's copy
      # of any shared library wins.
      - name: Publish command-line tool
        run: dotnet publish pulse-cli/pulse-cli.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ needs.version.outputs.version }} -o ./publish

      # Self-contained, like the Store package: Setup.exe must run on a PC without .NET installed.
      - name: Publish application
        run: dotnet publish ${{ env.PROJECT }} -c Release -r win-x64 --self-contained true -p:Version=${{ needs.version.outputs.version }} -o ./publish

      # Brand the Setup.exe so it doesn't look like a generic/untrusted bundle:
      #   --icon        the Pulse app icon on Setup.exe + Add/Remove Programs
      #   --packTitle   friendly display name ("Pulse", not the packId) in the installer UI
      #   --packAuthors publisher shown in the installer + Programs and Features
      # (packId stays DigitalWellbeingPC — it's the stable update identity, not a display name.)
      # NOTE: the "unknown publisher" SmartScreen warning is separate — that needs code signing
      # (the SignPath step at the boundary below), not packaging metadata.
      - name: Create Velopack release
        run: >
          vpk pack
          -u ${{ env.PACKAGE_NAME }}
          -v ${{ needs.version.outputs.version }}
          -p ./publish
          -o ./releases
          --mainExe ${{ env.MAIN_EXE }}
          --packTitle "Pulse"
          --packAuthors "Swaraj Dhondge"
          --icon digital-wellbeing-app/Resources/Icons/digital-balance-icon.ico

      - name: Upload Velopack artifacts (unsigned)
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: velopack-releases
          path: ./releases/*
          if-no-files-found: error
          retention-days: 7
    outputs:
      artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}

  # ==========================================================================
  # >>> UNSIGNED-ARTIFACT BOUNDARY <<<
  #
  # Everything ABOVE produces UNSIGNED build outputs (uploaded as the
  # `velopack-releases` artifact). Everything BELOW consumes already-built
  # artifacts and attaches them to the GitHub Release.
  #
  # The `sign` job below is real (not a comment) but deliberately does NOT gate
  # `release` - it only runs `if` SIGNPATH_API_TOKEN is configured, and
  # continue-on-error keeps a failed/unconfigured signing attempt from ever
  # blocking the GitHub Release or winget submission. Real blocker on actually
  # using it end-to-end is external (a SignPath account/cert), not engineering.
  # Once that's set up and validated, repoint `release`'s `needs` below from
  # `velopack-build` to `sign` to make the signed artifact the one that ships.
  # ==========================================================================
  sign:
    needs: [velopack-build]
    if: github.event_name == 'push'
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      SIGNPATH_CONFIGURED: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - name: Submit signing request to SignPath
        if: ${{ env.SIGNPATH_CONFIGURED != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: DigitalWellbeingPC
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.velopack-build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ./releases-signed

      - name: Upload signed Velopack artifacts
        if: ${{ env.SIGNPATH_CONFIGURED != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: velopack-releases-signed
          path: ./releases-signed/*
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------------------------------
  # RELEASE ATTACH
  # Downloads the built (currently unsigned) artifacts, generates checksums, and
  # publishes the GitHub Release. Depends only on the build jobs today; point it
  # at `sign` once the boundary above is filled in.
  # --------------------------------------------------------------------------
  release:
    needs: [version, velopack-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # NOTE: the demo (demo.mp4/gif) is intentionally NOT attached here. GitHub serves
      # release assets as octet-stream attachments, so they can't be embedded inline —
      # the README references the repo-committed copy instead
      # (.github/demo/demo.gif). So no repo checkout needed.
      - name: Download Velopack artifacts
        uses: actions/download-artifact@v8
        with:
          name: velopack-releases
          path: ./releases

      # SHA256SUMS.txt over the Velopack release set. Paths are relativized so the
      # checksum file is portable for verifiers.
      - name: Generate SHA256SUMS.txt
        run: |
          find ./releases -type f | while read -r f; do
            sha256sum "$f"
          done | sed 's|\./||' > SHA256SUMS.txt
          echo "----- SHA256SUMS.txt -----"
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            ./releases/*
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # WINGET SUBMISSION
  # Opens a PR to microsoft/winget-pkgs for the just-published release, pointing
  # at the Velopack Setup.exe attached above.
  #
  # This runs as a job HERE (needs: release) rather than as a separate workflow
  # listening for `release: published`. A release created by the default
  # GITHUB_TOKEN does NOT emit events that trigger other workflows, so the old
  # standalone winget.yml never fired. Running in this same tag-triggered run
  # sidesteps that entirely; `release-tag` tells the action which release to read.
  #
  # Disabled by default because winget-releaser can only update a package that already
  # exists in microsoft/winget-pkgs. After the first version is accepted manually, set
  # the repository variable WINGET_ENABLED=true and configure WINGET_TOKEN.
  # --------------------------------------------------------------------------
  winget:
    needs: [version, release]
    if: ${{ github.event_name == 'push' && vars.WINGET_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Submit to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: SwarajDhondge.DigitalWellbeingPC
          version: ${{ needs.version.outputs.version }}
          installers-regex: '.*Setup\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
          fork-user: ${{ github.repository_owner }}
