name: Soak Test

# Opt-in only - deliberately NOT on push/pull_request like ci.yml. These tests launch the real
# built exe as a real OS process and hard-kill it repeatedly (UITests/SoakTests.cs), which is
# slower and noisier than the fast unit-test suite belongs being on every push. Trigger manually
# from the Actions tab, or let the weekly schedule below catch regressions between releases.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC

permissions:
  contents: read

jobs:
  soak:
    # UI Automation (FlaUI) needs a real interactive desktop session, which windows-latest
    # GitHub-hosted runners provide (unlike Linux runners, which are headless).
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore DigitalWellbeing.sln

      - name: Build (Debug - AppSession resolves the Debug output path)
        run: dotnet build DigitalWellbeing.sln -c Debug --no-restore

      - name: Soak tests
        run: dotnet test UITests/UITests.csproj -c Debug --no-build --filter "FullyQualifiedName~SoakTests"
        timeout-minutes: 15
