name: CI

# Runs on every PR into main and every push to main. Fast feedback only —
# no packaging or publishing happens here (that lives in release.yml).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run for that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which product surface changed so site-only PRs do not spend a Windows
  # runner rebuilding the desktop app (and vice versa). Workflow edits run both.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          elif git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          else
            files=".github/workflows/ci.yml"
          fi

          app=false
          site=false
          while IFS= read -r file; do
            case "$file" in
              DigitalWellbeing.sln|digital-wellbeing-app/*|UITests/*|FixtureSeeder/*|.github/workflows/ci.yml)
                app=true
                ;;
            esac
            case "$file" in
              pulse/*|.github/workflows/ci.yml)
                site=true
                ;;
            esac
          done <<< "$files"

          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "site=$site" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # WPF app: build + unit tests (Windows-only, WPF / net9.0-windows).
  # --------------------------------------------------------------------------
  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore DigitalWellbeing.sln

      - name: Build
        run: dotnet build DigitalWellbeing.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test digital-wellbeing-app/Tests/Tests.csproj -c Release --no-build

  # --------------------------------------------------------------------------
  # Marketing site (pulse/, Next.js). Cross-platform, so Ubuntu is fine.
  # --------------------------------------------------------------------------
  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulse
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pulse/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
