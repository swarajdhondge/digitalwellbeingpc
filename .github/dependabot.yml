version: 2
updates:
  # .NET application and test dependencies.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - ".net"
    ignore:
      # OpenTK (via LiveCharts/SkiaSharp) only accepts GLFW 3.3.x.
      - dependency-name: "OpenTK.redist.glfw"
        versions: [">= 3.4"]
      # NAudio 3 is a major release; upgrade deliberately, not through Dependabot.
      - dependency-name: "NAudio"
        versions: [">= 3"]
      # System.Drawing.Common 10+ targets .NET 10; the app targets .NET 9.
      - dependency-name: "System.Drawing.Common"
        versions: [">= 10"]

  # Marketing site (pulse/, Next.js).
  - package-ecosystem: "npm"
    directory: "/pulse"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "site"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
    ignore:
      # Current Next.js tooling is not compatible with these majors yet.
      - dependency-name: "eslint"
        versions: [">= 10"]
      - dependency-name: "typescript"
        versions: [">= 7"]
      - dependency-name: "@types/node"
        # Keep type definitions aligned with the Node 24 runtime used by CI/Vercel.
        versions: [">= 25"]

  # Actions used by ci.yml / release.yml / soak-test.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"
